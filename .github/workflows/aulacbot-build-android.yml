name: AuLacBot — build Android APK (.apk)

# Builds the AuLacBot mobile app (Expo / React Native in openbot/mobile) into an
# installable APK on a Linux runner with the Android SDK.
# Run it manually from the Actions tab, or push a version tag (v*) to trigger it.
# The .apk is uploaded as a workflow artifact named "AuLacBot-Android-APK", and
# on tag runs it is also published (as AuLacBot.apk) to that tag's GitHub
# Release so anyone can download it without signing in.
#
# NOTE: `expo prebuild` signs the release build with the debug key by default, so
# this APK is for direct/internal installation. For Google Play or consistent
# update signing, configure a real release keystore and signingConfig first.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
      # The app refuses to start without a server URL baked in at build time
      # (openbot/mobile/src/auth.ts throws at import when it is missing, which
      # crashed the v0.1.1 APK instantly on open). There is no public AuLacBot
      # server yet, so this is a placeholder HTTPS origin: the app opens to
      # the sign-in screen and simply cannot reach a server. Rebuild with the
      # real deployment URL once one exists.
      EXPO_PUBLIC_SERVER_URL: "https://localhost"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install mobile dependencies
        working-directory: openbot/mobile
        run: npm ci

      - name: Generate native Android project
        working-directory: openbot/mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: openbot/mobile/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuLacBot-Android-APK
          path: openbot/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Prepare APK for release
        if: github.ref_type == 'tag'
        run: cp openbot/mobile/android/app/build/outputs/apk/release/app-release.apk AuLacBot.apk

      - name: Publish APK to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: AuLacBot.apk
          fail_on_unmatched_files: true
